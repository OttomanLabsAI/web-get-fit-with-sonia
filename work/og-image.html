<!doctype html>
<!-- The sharing thumbnail, public/assets/img/og.jpg (1200x630).
     To regenerate: serve the repository root (python3 -m http.server 8000), open
     http://localhost:8000/work/og-image.html in Chromium at a 1200x630 viewport,
     screenshot it, save as JPEG (quality about 86, well under 300 KB), and bump the
     ?v= stamp on og:image in public/index.html and public/improvements/index.html.
     Every fact on it comes from work/brief.json. -->
<html lang="en-GB"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Oswald";font-weight:700;src:url("../public/fonts/oswald-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Oswald";font-weight:500;src:url("../public/fonts/oswald-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Open Sans";font-weight:600;src:url("../public/fonts/open-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Open Sans";font-weight:400;src:url("../public/fonts/open-sans-latin-400-normal.woff2") format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#1f3a10;color:#fffefb;font-family:"Open Sans",sans-serif;position:relative}
/* Sonia's portrait at its own 3:4 proportions, full height on the right */
.photo{position:absolute;right:0;top:0;width:473px;height:630px;object-fit:cover;object-position:50% 0}
.seam{position:absolute;left:719px;top:0;width:8px;height:630px;background:#83ba28}
.panel{position:absolute;left:0;top:0;width:719px;height:630px;padding:54px 40px 0 72px}
.top{display:flex;align-items:center;gap:20px}
.badge{width:68px;height:68px;display:block}
.kicker{font-family:"Oswald";font-weight:500;text-transform:uppercase;letter-spacing:.14em;font-size:27px;color:#a6d94f;line-height:1}
h1{margin:44px 0 0;font-family:"Oswald";font-weight:700;text-transform:uppercase;font-size:124px;line-height:.9;letter-spacing:.005em}
.classes{margin:32px 0 0;font-weight:600;font-size:26px;line-height:1.3;color:#fffefb;white-space:nowrap}
.chips{display:flex;gap:14px;margin-top:40px}
.chip{font-family:"Oswald";font-weight:500;text-transform:uppercase;letter-spacing:.05em;font-size:32px;line-height:1;padding:12px 18px 13px;border-radius:8px;background:#83ba28;color:#171a14}
.chip--ghost{background:transparent;color:#fffefb;box-shadow:inset 0 0 0 3px #fffefb}
/* the six class colours from the site, as a stripe along the bottom */
.stripe{position:absolute;left:0;bottom:0;width:719px;height:14px;display:flex}
.stripe i{flex:1}
</style></head><body>
<img class="photo" src="../public/assets/img/sonia-portrait-1200.jpg" alt="">
<div class="seam"></div>
<div class="panel">
  <div class="top"><img class="badge" src="../public/favicon.svg" alt=""><span class="kicker">North London · Mon–Fri daytime</span></div>
  <h1>Get fit<br>with Sonia</h1>
  <p class="classes">Zumba · Keep fit · Chair exercise · Line dancing</p>
  <div class="chips"><span class="chip">£12 a class</span><span class="chip chip--ghost">10 for £90</span></div>
</div>
<div class="stripe"><i style="background:#e8641b"></i><i style="background:#83ba28"></i><i style="background:#2b6cb0"></i><i style="background:#7b3fa6"></i><i style="background:#d9a51a"></i><i style="background:#c2185b"></i></div>
</body></html>
